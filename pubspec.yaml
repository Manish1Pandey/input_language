name: keyboard_language
description: Detect and stream the active keyboard / input language (BCP-47, RTL) on iOS, Android, macOS, Windows, Linux and web, and auto-set TextField direction.
version: 0.1.0
homepage: https://github.com/Manish1Pandey/keyboard_language
repository: https://github.com/Manish1Pandey/keyboard_language
issue_tracker: https://github.com/Manish1Pandey/keyboard_language/issues
topics:
  - keyboard
  - rtl
  - bidi
  - input-method
  - localization

screenshots:
  - description: "iOS simulator with the Hebrew keyboard active: the example reports he-IL and AutoDirectionTextField is right-to-left."
    path: screenshots/ios_hebrew_rtl.png

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.manishpanday.keyboard_language
        pluginClass: KeyboardLanguagePlugin
      ios:
        pluginClass: KeyboardLanguagePlugin
      macos:
        pluginClass: KeyboardLanguagePlugin
      windows:
        pluginClass: KeyboardLanguagePluginCApi
      linux:
        dartPluginClass: KeyboardLanguageLinux
        dartFileName: keyboard_language_linux.dart
      web:
        pluginClass: KeyboardLanguageWeb
        fileName: keyboard_language_web.dart
